<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Queries Review</title>
    <style>
      /* Mobile First Design */
      body {
        background-color: rgb(147, 187, 233);
      }
      h1,
      h2 {
        color: rgb(255, 255, 255);
        text-align: center;
      }
      /* Tablet and Desktop Design */
      @media screen and (min-width: 700px) {
        body {
          background-color: rgb(219, 164, 243);
        }
        h1,
        h2 {
          color: rgb(0, 0, 0);
        }
      }
      @media screen and (min-width: 960px) {
        body {
          background-color: rgb(253, 163, 250);
        }
        h1,
        h2 {
          color: rgb(255, 255, 255);
        }
      }
      @media screen and (min-width: 1280px) {
        body {
          background-color: rgb(253, 176, 163);
        }
        h1,
        h2 {
          color: rgb(0, 0, 0);
        }
      }
    </style>
  </head>

  <body>
    <h1>Media Queries</h1>
    <h2>Nox Rios</h2>
  </body>
</html>
